# Cloudflare Worker "rackofci-energy": zdroj dát pre appku (kiosk + predpoveď v KV).
# Nasadenie: pozri worker/README.md. Secret KIOSK_URL sa nastavuje cez `wrangler secret put`.
name = "rackofci-energy"
main = "src/index.js"
compatibility_date = "2026-08-29"

[triggers]
crons = ["*/5 * * * *"]

# ID namespace doplní `npx wrangler kv namespace create PV_DATA` (pozri README).
[[kv_namespaces]]
binding = "PV_DATA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
